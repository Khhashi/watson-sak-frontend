name: Legg til deploy-knapper
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  legg-til-deploy-kommentar:
    name: Legg til deploy-knapper
    runs-on: ubuntu-latest
    steps:
      - name: Legg til deploy-knapp i PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const devWorkflowId = 'deploy-til-dev.yml';
            const demoWorkflowId = 'deploy-til-demo.yml';

            // Fetch existing comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            // Check if we already have a deploy comment
            const hasAlreadyAddedDeployComment = comments.data.some(comment => 
              comment.body.includes('🚀 Deploy')
            );

            if (!hasAlreadyAddedDeployComment) {
              const comment = `## 🚀 Deploy

              Vil du deploye denne branchen noe sted?

              [![Deploy til dev-miljø](https://img.shields.io/badge/Deploy-til_dev-blue?style=for-the-badge)](${context.payload.repository.html_url}/actions/workflows/${devWorkflowId})
              
              [![Deploy til demo-miljø](https://img.shields.io/badge/Deploy-til_demo-green?style=for-the-badge)](${context.payload.repository.html_url}/actions/workflows/${demoWorkflowId})

              Klikk på knappen over, trykk "Run workflow", velg branchen "${context.payload.pull_request.head.ref}" og trykk på den grønne knappen.`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
