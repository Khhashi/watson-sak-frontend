name: Deploy unleash api-token

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Velg miljø"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: "read"
  id-token: "write"
  packages: "write"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy unleash api-token til ${{ github.event.inputs.environment }}
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: ${{ github.event.inputs.environment == 'prod' && 'prod-gcp' || 'dev-gcp' }}
          RESOURCE: .nais/unleash-api-token.yaml
          VARS: .nais/${{ github.event.inputs.environment }}.json
          PRINT_PAYLOAD: true
